name: Deploy panel (BirCloud)

# Panel Next.js: statik değil, çalışan bir süreç. Bu yüzden yönetim
# konsolundaki "dist klasörünü kopyala" kalıbı işe yaramıyor —
# `standalone` çıktısı taşınıyor ve systemd servisi yeniden başlatılıyor.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-panel
  cancel-in-progress: false

env:
  HEDEF_DIZIN: /var/www/panel

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: SSH anahtarını hazırla
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Çıktıyı topla
        # standalone, static ve public'i AYRI üretiyor; üçü bir araya
        # gelmezse sayfa açılır ama CSS ve JS 404 verir.
        run: |
          mkdir -p paket
          cp -r .next-build/standalone/. paket/
          mkdir -p paket/.next-build/static
          cp -r .next-build/static/. paket/.next-build/static/
          [ -d public ] && cp -r public paket/public || true

      - name: Sunucuya gönder
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            paket/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$HEDEF_DIZIN/"

      - name: Servisi yeniden başlat
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl restart iberry-panel && sleep 3 && systemctl is-active iberry-panel"

      - name: Ayakta mı
        # Deploy'un "başarılı" görünüp sitenin açılmaması en can sıkıcı
        # durum; sonuna gerçek bir istek atıyoruz.
        run: |
          for i in $(seq 1 10); do
            kod=$(curl -s -o /dev/null -w '%{http_code}' https://panel.furkantandogan.com/ || true)
            [ "$kod" = "200" ] && echo "✓ panel ayakta" && exit 0
            sleep 5
          done
          echo "✗ panel 200 dönmedi (son kod: $kod)"
          exit 1

      # SONUCU KENDİMİZ BİLDİRİYORUZ — GitHub'a sormuyoruz.
      #
      # Panelin deploy ekranı bunu okuyor. GitHub API'sinden çekmek bir okuma
      # jetonu gerektiriyordu: üretilecek, süresi dolacak, sızabilecek bir
      # kimlik bilgisi — yalnız "hangi commit ne zaman çıktı" sorusu için.
      # SSH erişimi zaten var.
      #
      # `if: always()` ŞART: asıl öğrenmek istediğimiz başarısız dağıtım.
      # Yalnız başarılıları yazsaydık ekran her zaman iyi görünürdü.
      - name: Dağıtım sonucunu bildir
        if: always()
        env:
          # Kabuğa DEĞİŞKENLE giriyor: commit mesajı tırnak ya da `$(...)`
          # içerebilir ve doğrudan gömmek komut enjeksiyonu demek.
          MESAJ: ${{ github.event.head_commit.message }}
          DEPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          KISI: ${{ github.actor }}
          DURUM: ${{ job.status }}
          CALISMA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Tek satıra indir: çok satırlı commit mesajı SQL'i bölmesin.
          MESAJ_TEK=$(printf '%s' "$MESAJ" | tr '\n' ' ' | cut -c1-300)
          printf '%s\0%s\0%s\0%s\0%s\0%s' "$DEPO" "$SHA" "$MESAJ_TEK" "$KISI" "$DURUM" "$CALISMA" \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                'IFS= read -r -d "" DEPO; IFS= read -r -d "" SHA; IFS= read -r -d "" MESAJ;
                 IFS= read -r -d "" KISI; IFS= read -r -d "" DURUM; IFS= read -r CALISMA;
                 cd ~/iberry-central-backend/deploy &&
                 docker compose -f docker-compose.prod.yml exec -T postgres \
                   psql -U iberry -d iberry -X -q \
                     -v d="$DEPO" -v s="$SHA" -v m="$MESAJ" -v k="$KISI" -v st="$DURUM" -v u="$CALISMA" \
                     <<< "INSERT INTO deploy_runs (repo, sha, message, actor, status, run_url) VALUES (:'"'"'d'"'"', :'"'"'s'"'"', :'"'"'m'"'"', :'"'"'k'"'"', :'"'"'st'"'"', :'"'"'u'"'"');"' \
            || echo "::warning::Dağıtım kaydı yazılamadı (dağıtımın kendisi etkilenmedi)"
